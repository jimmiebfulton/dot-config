locals:
  enabled: false
  paths:
    # archetect-common holds the canonical shared libraries (author, org, project,
    # ports, archive, etc.); list it first so those resolve to the open-source copies.
    - /Users/jimmie/personal/archetect-common/
    - /Users/jimmie/work/p6m-archetypes3/
    - /Users/jimmie/personal/archetect-rust/

catalog:
  p6m:
    description: "P6M Catalog"
    source: "https://github.com/p6m-archetypes/p6m-catalog.git#dev"
  archetect:
    description: "Archetect Catalog"
    source: "https://github.com/archetect/archetect-catalog.git"
  anemnez:
    description: "Anemnez Catalog"
    # The published catalog, like the two above. A local path resolves only on this machine and
    # silently shadows what everyone else renders; the catalog is now a repo, so point at it.
    # Swap back to "/Users/jimmie/personal/anemnez/anemnez-catalog" while actively editing entries,
    # then swap forward once they are pushed.
    source: "ssh://git@github.com/anemnez/anemnez-catalog.git"
